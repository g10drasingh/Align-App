<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC653"/>
      <stop offset="1" stop-color="#357F22"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F28C0F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f3a07" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle base -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#gloss)"/>

  <!-- Left-aligned ledger bars: alignment + progress -->
  <g filter="url(#shadow)" fill="#fff">
    <rect x="270" y="342" width="470" height="76" rx="38"/>
    <rect x="270" y="474" width="350" height="76" rx="38" fill-opacity="0.92"/>
    <rect x="270" y="606" width="230" height="76" rx="38" fill-opacity="0.82"/>
  </g>

  <!-- CEO attention badge -->
  <g filter="url(#shadow)">
    <circle cx="774" cy="250" r="82" fill="#fff"/>
    <circle cx="774" cy="250" r="62" fill="url(#plum)"/>
  </g>
</svg>
